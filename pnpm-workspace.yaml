# SPDX-License-Identifier: MIT
packages:
  - engine
  - resolver
  - speech
  - ocr
  - app
  - tools/*
  - server
minimumReleaseAge: 20160
# No dependency needs an install script (checked with pnpm install on 2026-11-03),
# so none is allowed. Add an allowBuilds entry only with a recorded reason.
# esbuild (pulled in by tsx, which runs the pack tools) only has an optional
# post-install optimisation; its platform binary comes from an optional
# dependency, so the script stays denied (checked on 2026-11-04).
allowBuilds:
  esbuild: false
  # onnxruntime-node (pulled in by @huggingface/transformers, used only when the
  # model runs in Node) ships its CPU binaries in the package; its install
  # script only downloads the CUDA and TensorRT providers on linux/x64, which
  # SIAPSO never uses, so the script stays denied (checked on 2026-11-04).
  onnxruntime-node: false
  # protobufjs (pulled in by onnxruntime-node) only prints a version scheme
  # warning after install, so its script stays denied (checked on 2026-11-04).
  protobufjs: false
