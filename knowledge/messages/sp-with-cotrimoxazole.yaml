id: sp-with-cotrimoxazole
fr:
  fact: 'Ce produit contient de la sulfadoxine et de la pyriméthamine (SP), données pour prévenir le paludisme pendant la grossesse.'
  risk: 'Si la femme prend du cotrimoxazole (Bactrim), ce médicament peut provoquer avec lui des effets indésirables, comme une anémie.'
  risk-detail: "La SP et le cotrimoxazole agissent tous les deux contre l'acide folique. Les recommandations sur le paludisme pendant la grossesse ne prévoient pas la SP pour une femme qui prend du cotrimoxazole chaque jour : la sage-femme choisit la protection contre le paludisme."
  orientation: 'Avant la SP, si du cotrimoxazole (par exemple le Bactrim) est pris chaque jour, dites-le à la sage-femme, sans rien changer au traitement.'
en:
  fact: 'This product contains sulfadoxine and pyrimethamine (SP), given to prevent malaria during pregnancy.'
  risk: 'If the woman takes co-trimoxazole (Bactrim), this medicine can cause side effects with it, such as anaemia.'
  risk-detail: 'SP and co-trimoxazole both act against folic acid. Guidance on malaria in pregnancy does not plan SP for a woman who takes co-trimoxazole every day: the midwife chooses the malaria protection.'
  orientation: 'Before SP, if co-trimoxazole (for example Bactrim) is taken every day, tell the midwife, and change nothing in the treatment.'
