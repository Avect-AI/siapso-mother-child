# Builtin note of a max-dose rule (C7): units per day were given for a product
# holding the substance, but neither its strength nor a strength of its family
# is known, so the daily total cannot be computed. A note, never a level; it
# states no dose. Said before the next dose (live test round 2, SCRUM-52): a
# woman who cannot read the box may be taking far too much.
id: max-dose-not-computable
fr:
  fact: 'La quantité totale ne peut pas être calculée sans le dosage.'
  risk: 'Nous ne pouvons pas dire si la quantité maximale est dépassée.'
  orientation: "Montrez les boîtes à la sage-femme, à l'infirmier ou au pharmacien avant la prochaine prise."
  orientation-accompanied: "Montrez les boîtes à la sage-femme ou à l'infirmier avant qu'elle en reprenne."
en:
  fact: 'The total amount cannot be worked out without the strength.'
  risk: 'We cannot tell whether the daily maximum is exceeded.'
  orientation: 'Show the boxes to the midwife, the nurse or the pharmacist before the next dose.'
  orientation-accompanied: 'Show the boxes to the midwife or the nurse before she takes any more.'
