id: tramadol-breastfeeding-baby-signs
fr:
  fact: 'Ce produit contient du tramadol, et le bébé allaité a maintenant un signe que le tramadol du lait peut provoquer.'
  risk: 'Un bébé qui dort beaucoup, tète mal ou respire difficilement pendant que sa mère prend du tramadol peut avoir reçu trop de tramadol par le lait : sa respiration peut ralentir et sa vie peut être en danger.'
  risk-detail: 'Chez certaines femmes, le corps transforme très vite le tramadol en une forme plus forte, qui passe aussi dans le lait. La notice américaine décrit chez le bébé allaité une somnolence excessive et une respiration ralentie, des effets graves.'
  orientation: 'Allez au poste de santé maintenant avec le bébé, et montrez ce produit.'
en:
  fact: 'This product contains tramadol, and the breastfed baby now has a sign that tramadol in the milk can cause.'
  risk: 'A baby who sleeps a lot, feeds poorly or breathes with difficulty while the mother takes tramadol may have had too much tramadol through the milk: the breathing can slow down and the life of the baby can be in danger.'
  risk-detail: 'In some women the body turns tramadol very fast into a stronger form, which also passes into the milk. The US label describes excess sleepiness and slowed breathing in the breastfed baby, serious effects.'
  orientation: 'Go to the health post now with the baby, and show this product.'
