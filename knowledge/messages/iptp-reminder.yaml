# A reminder: shown in accompanied mode only, so it speaks about the woman.
id: iptp-reminder
fr:
  fact: 'Demandez si elle a reçu le traitement préventif du paludisme de la grossesse (SP) : son carnet ou la sage-femme peuvent le dire.'
  risk: 'Le paludisme pendant la grossesse peut provoquer une anémie chez la mère et un bébé de petit poids.'
en:
  fact: 'Ask whether she has received the preventive malaria treatment of pregnancy (SP): her booklet or the midwife can tell.'
  risk: 'Malaria during pregnancy can cause anaemia in the mother and a low birth weight baby.'
