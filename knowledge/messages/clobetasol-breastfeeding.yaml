id: clobetasol-breastfeeding
fr:
  fact: 'Ce produit contient du clobétasol, une cortisone très forte pour la peau.'
  risk: "Si la crème est mise sur le sein ou le mamelon, le bébé peut l'avaler, et sur de grandes surfaces, elle peut passer dans le lait."
  risk-detail: "La notice demande de ne pas l'appliquer sur les seins pendant l'allaitement et d'éviter un contact prolongé du bébé avec la peau traitée. Une utilisation courte sur une petite zone, en dehors des seins, est possible pendant l'allaitement selon la notice."
en:
  fact: 'This product contains clobetasol, a very strong cortisone for the skin.'
  risk: 'If the cream is put on the breast or the nipple, the baby can swallow it, and on large areas it can pass into the milk.'
  risk-detail: 'The label asks not to apply it on the breasts during breastfeeding and to avoid long contact of the baby with the treated skin. According to the label, short use on a small area, away from the breasts, is possible during breastfeeding.'
