id: valproate-pregnancy
fr:
  fact: "Ce produit contient du valproate ou un dérivé (acide valproïque, valpromide), un traitement de l'épilepsie ou de certains troubles de l'humeur."
  risk: "Pendant la grossesse, il peut provoquer des malformations graves et des troubles du développement chez l'enfant, mais un traitement de l'épilepsie ne doit pas être arrêté sans l'avis d'un médecin : des crises graves peuvent survenir."
  risk-detail: "Près de 11 bébés sur 100 exposés pendant la grossesse ont des malformations, contre 2 à 3 sur 100 dans la population générale, notamment de la colonne vertébrale (spina bifida). La notice demande de ne pas interrompre le traitement sans l'avis du médecin, car la maladie pourrait s'aggraver."
  orientation: 'Parlez-en rapidement à la sage-femme ou au médecin, sans rien changer au traitement en attendant.'
en:
  fact: 'This product contains valproate or a derivative (valproic acid, valpromide), a treatment for epilepsy or for some mood disorders.'
  risk: 'During pregnancy it can cause serious birth defects and developmental problems in the child, but an epilepsy treatment must not be ended without a doctor: serious seizures can happen.'
  risk-detail: 'About 11 in 100 babies exposed during pregnancy have birth defects, against 2 to 3 in 100 in the general population, among them defects of the spine (spina bifida). The label asks not to interrupt the treatment without the doctor, because the illness could get worse.'
  orientation: 'Talk to the midwife or the doctor soon, and change nothing in the treatment until then.'
