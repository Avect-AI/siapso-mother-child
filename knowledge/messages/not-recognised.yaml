# The grey cards of one result name the same people with the same words
# (live test round 2, SCRUM-52): "Montrez ce produit", in accompanied mode to
# the person helping, about her ("à sa prochaine visite").
id: not-recognised
fr:
  fact: "Ce produit n'a pas été reconnu."
  risk: "Nous n'avons pas d'information fiable sur ce produit. On ne sait pas s'il peut faire du mal."
  orientation: 'Montrez ce produit à la sage-femme ou au pharmacien à la prochaine visite.'
  orientation-accompanied: "Montrez ce produit à la sage-femme ou à l'infirmier à sa prochaine visite."
en:
  fact: 'This product was not recognised.'
  risk: 'We have no reliable information on this product. We do not know whether it can cause harm.'
  orientation: 'Show this product to the midwife or the pharmacist at the next visit.'
  orientation-accompanied: 'Show this product to the midwife or the nurse at her next visit.'
