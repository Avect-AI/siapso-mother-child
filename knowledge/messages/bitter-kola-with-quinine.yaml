id: bitter-kola-with-quinine
fr:
  fact: 'Le kola amer (Garcinia kola) est pris avec de la quinine, un traitement du paludisme.'
  risk: 'Une étude chez des volontaires a montré que le kola amer fait baisser la quinine dans le sang, ce qui pourrait rendre le traitement moins efficace.'
  risk-detail: "L'étude a été faite chez 24 adultes en bonne santé au Nigeria : avec du kola amer pris chaque jour pendant environ une semaine, le pic de quinine dans le sang était plus bas. L'effet sur la guérison n'a pas été mesuré, et aucune femme enceinte n'a été étudiée. Le traitement du paludisme reste important : rien ne doit changer sans un professionnel."
  orientation: "Montrez ces produits à la sage-femme ou à l'infirmier dans les prochains jours. Si la fièvre continue ou revient, retournez au poste de santé."
en:
  fact: 'Bitter kola (Garcinia kola) is taken with quinine, a malaria treatment.'
  risk: 'A study in volunteers showed that bitter kola lowers quinine in the blood, which could make the treatment work less well.'
  risk-detail: 'The study included 24 healthy adults in Nigeria: with bitter kola eaten every day for about a week, the peak of quinine in the blood was lower. The effect on cure was not measured, and no pregnant woman was studied. The malaria treatment still matters: nothing should change without a professional.'
  orientation: 'Show these products to the midwife or the nurse in the coming days. If the fever continues or comes back, go back to the health post.'
