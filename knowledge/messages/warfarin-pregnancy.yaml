id: warfarin-pregnancy
fr:
  fact: 'Ce produit contient de la warfarine, un médicament qui fluidifie le sang (anticoagulant).'
  risk: 'Pendant la grossesse, il peut provoquer des malformations et des saignements graves chez le bébé, mais changer seule ce traitement peut aussi être dangereux.'
  risk-detail: 'Pris au premier trimestre, il peut provoquer un ensemble de malformations ; plus tard, il expose à des saignements du bébé et à la perte de la grossesse. Chez une femme qui a une valve cardiaque mécanique, ce sont des spécialistes qui pèsent les risques.'
  orientation: 'Parlez-en rapidement à la sage-femme ou au médecin, sans rien changer au traitement en attendant.'
en:
  fact: 'This product contains warfarin, a medicine that thins the blood (anticoagulant).'
  risk: 'During pregnancy it can cause birth defects and serious bleeding in the baby, but changing this treatment alone can also be dangerous.'
  risk-detail: 'Taken in the first trimester, it can cause a pattern of birth defects; later, it exposes the baby to bleeding and the pregnancy to loss. For a woman with a mechanical heart valve, specialists weigh the risks.'
  orientation: 'Talk to the midwife or the doctor soon, and change nothing in the treatment until then.'
