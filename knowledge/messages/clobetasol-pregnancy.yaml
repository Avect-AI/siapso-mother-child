id: clobetasol-pregnancy
fr:
  fact: 'Ce produit contient du clobétasol, une cortisone très forte pour la peau, présente aussi dans certaines crèmes pour éclaircir la peau.'
  risk: 'Mis sur de grandes surfaces, longtemps ou pour éclaircir la peau, il passe dans le sang et a été lié à des bébés de petit poids.'
  risk-detail: "À Dakar, les femmes enceintes qui utilisaient des produits éclaircissants très forts avaient moins de cortisol, un placenta plus petit et plus de bébés de petit poids. Une revue d'études a trouvé un lien probable entre les cortisones fortes sur la peau et le petit poids de naissance. Les notices demandent de peser les risques avant une utilisation pendant la grossesse. Après un long usage, un arrêt brutal peut aussi être un risque."
  orientation: "Parlez-en rapidement à la sage-femme, à l'infirmier ou au pharmacien, sans rien changer en attendant : un arrêt brutal peut aussi poser problème."
en:
  fact: 'This product contains clobetasol, a very strong cortisone for the skin, also found in some skin-lightening creams.'
  risk: 'Put on large areas, for a long time or to lighten the skin, it passes into the blood and has been linked to babies with a low birth weight.'
  risk-detail: 'In Dakar, pregnant women who used very strong lightening products had less cortisol, a smaller placenta and more babies with a low birth weight. A review of studies found a probable link between strong skin cortisones and low birth weight. The labels ask to weigh the risks before any use during pregnancy. After long use, a sudden end of the treatment can also be a risk.'
  orientation: 'Talk to the midwife, the nurse or the pharmacist soon, and change nothing until then: ending it suddenly can also cause problems.'
