# Grey message of the remedies without reliable data. Woman mode hides the
# fact, so the risk names its subject and stands alone.
id: evidence-0
fr:
  fact: "Nous n'avons pas d'information fiable sur ce produit pendant la grossesse ou l'allaitement."
  risk: "Le manque d'information sur ce produit ne veut pas dire qu'il est sans risque."
  orientation: 'Montrez-le à la sage-femme ou au pharmacien à la prochaine visite.'
en:
