# With a baby sign of the orientation ticked as a danger sign now,
# codeine-breastfeeding-baby-signs makes the card a danger of its own.
id: codeine-breastfeeding
fr:
  fact: 'Ce produit contient de la codéine, un médicament contre la douleur ou la toux.'
  risk: 'La codéine passe dans le lait, et des cas graves de somnolence et de respiration ralentie ont été rapportés chez des bébés allaités.'
  risk-detail: "Le corps transforme la codéine en morphine. Chez certaines femmes, cette transformation est très rapide et le lait contient plus de morphine. Les nouveau-nés sont particulièrement sensibles. La notice française contre-indique ces médicaments pendant l'allaitement ; des spécialistes discutent la force de ces données."
  orientation: "Montrez ce produit à la sage-femme, à l'infirmier ou au pharmacien avant la prochaine prise. Si le bébé dort beaucoup plus que d'habitude, tète mal, respire difficilement ou devient mou, allez au poste de santé maintenant."
  orientation-accompanied: "Montrez ce produit à la sage-femme ou à l'infirmier avant qu'elle en reprenne. Si le bébé dort beaucoup plus que d'habitude, tète mal, respire difficilement ou devient mou, allez au poste de santé maintenant."
en:
  fact: 'This product contains codeine, a medicine for pain or cough.'
  risk: 'Codeine passes into breast milk, and serious cases of sleepiness and slowed breathing have been reported in breastfed babies.'
  risk-detail: 'The body turns codeine into morphine. In some women this happens very fast and the milk holds more morphine. Newborns are especially sensitive. The French label contraindicates these medicines during breastfeeding; experts debate how strong these data are.'
  orientation: 'Show this product to the midwife, the nurse or the pharmacist before the next dose. If the baby sleeps much more than usual, feeds poorly, breathes with difficulty or becomes floppy, go to the health post now.'
  orientation-accompanied: 'Show this product to the midwife or the nurse before she takes any more. If the baby sleeps much more than usual, feeds poorly, breathes with difficulty or becomes floppy, go to the health post now.'
