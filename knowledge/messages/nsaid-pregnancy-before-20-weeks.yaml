# The kidney risk from 12 weeks is said in the risk both modes read (live test
# round 2, SCRUM-52): it was behind "Pourquoi ?", which woman mode never shows,
# while the rule covers 12 to 19 weeks. In words, since a risk holds no digit.
id: nsaid-pregnancy-before-20-weeks
fr:
  fact: "Ce produit contient un anti-inflammatoire non stéroïdien (AINS), comme l'ibuprofène ou le diclofénac."
  risk: "Des études ont observé plus de fausses couches quand ce type de médicament est pris au début de la grossesse. À partir de douze semaines d'aménorrhée, la notice signale aussi qu'il peut gêner le travail des reins du bébé."
  risk-detail: "La notice française indique qu'avant le sixième mois, ce médicament ne doit être prescrit qu'en cas de nécessité absolue."
en:
  fact: 'This product contains a non-steroidal anti-inflammatory drug (NSAID), such as ibuprofen or diclofenac.'
  risk: "Studies have seen more miscarriages when this type of medicine is taken early in pregnancy. From twelve weeks of amenorrhoea, the label also warns that it can disturb the work of the baby's kidneys."
  risk-detail: 'The French label allows this medicine before the sixth month only when it is absolutely necessary.'
