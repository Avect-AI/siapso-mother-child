# SPDX-License-Identifier: CC-BY-4.0
# Built-in message of a product that a rule of the base reads, when no rule
# applies to the situation (another term, not pregnant, no partner). It says a
# gap in the base, never an all-clear, and never "nothing found": the base
# does hold something on this product, but not for this situation. The app
# adds the version and date of the knowledge base after the first sentence,
# as for nothing-found.
id: nothing-applies
fr:
  fact: 'Notre base ne contient rien sur ce produit pour cette situation.'
  risk: "Cela ne veut pas dire qu'il est sans risque."
  orientation: 'Montrez cet écran à la sage-femme ou au pharmacien à la prochaine visite.'
en:
  fact: 'Our knowledge base holds nothing on this product for this situation.'
  risk: 'This does not mean it is risk-free.'
  orientation: 'Show this screen to the midwife or the pharmacist at the next visit.'
