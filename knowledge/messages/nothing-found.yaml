# Built-in message of a product that no rule of the base reads; the app reads
# the fact, then the risk. Since the live test round 2 (SCRUM-52) it says the
# same words as nothing-applies: one grey wording for a product the app has
# recognised but the base has nothing on for her situation ("Rien n'a été
# trouvé sur ce produit" read as "the app does not know this medicine", just
# after the app found it). The version and date of the knowledge base are on
# the result, at the top and at the end, never inside her sentence. The risk
# is said positively, so that a listener who hears only the end never hears
# "sans risque". It speaks of the base, not of what anyone knows: another
# source may know more. "Ce produit", never "cet écran": a passer-by's screen
# is gone once the next one starts.
id: nothing-found
fr:
  fact: 'Notre base ne contient rien sur ce produit pour cette situation.'
  risk: 'Notre base ne dit pas si ce produit peut faire du mal dans cette situation.'
  orientation: 'Montrez ce produit à la sage-femme ou au pharmacien à la prochaine visite.'
  orientation-accompanied: "Montrez ce produit à la sage-femme ou à l'infirmier à sa prochaine visite."
en:
  fact: 'Our knowledge base holds nothing on this product for this situation.'
  risk: 'Our knowledge base does not say whether this product can cause harm in this situation.'
  orientation: 'Show this product to the midwife or the pharmacist at the next visit.'
  orientation-accompanied: 'Show this product to the midwife or the nurse at her next visit.'
