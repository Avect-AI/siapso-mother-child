# Before the next dose since the live test round 2 (SCRUM-52), like codeine:
# the US label advises against breastfeeding during the treatment. With a
# baby sign of the orientation ticked as a danger sign now,
# tramadol-breastfeeding-baby-signs makes the card a danger of its own.
id: tramadol-breastfeeding
fr:
  fact: 'Ce produit contient du tramadol, un médicament contre la douleur.'
  risk: 'Le tramadol passe dans le lait, et les nouveau-nés sont très sensibles à ce type de médicament : une somnolence et une respiration ralentie peuvent survenir chez le bébé allaité.'
  risk-detail: "Chez certaines femmes, le corps transforme très vite le tramadol en une forme plus forte, qui passe aussi dans le lait. La notice française déconseille le tramadol pendant l'allaitement, et la notice américaine aussi, à cause d'effets graves possibles chez le bébé allaité."
  orientation: "Montrez ce produit à la sage-femme, à l'infirmier ou au pharmacien avant la prochaine prise. Si le bébé dort beaucoup plus que d'habitude, tète mal, respire difficilement ou devient mou, allez au poste de santé maintenant."
  orientation-accompanied: "Montrez ce produit à la sage-femme ou à l'infirmier avant qu'elle en reprenne. Si le bébé dort beaucoup plus que d'habitude, tète mal, respire difficilement ou devient mou, allez au poste de santé maintenant."
en:
  fact: 'This product contains tramadol, a medicine for pain.'
  risk: 'Tramadol passes into breast milk, and newborns are very sensitive to this type of medicine: sleepiness and slowed breathing can happen in the breastfed baby.'
  risk-detail: 'In some women the body turns tramadol very fast into a stronger form, which also passes into the milk. The French label advises against tramadol during breastfeeding, and so does the US label, because of possible serious effects in the breastfed baby.'
  orientation: 'Show this product to the midwife, the nurse or the pharmacist before the next dose. If the baby sleeps much more than usual, feeds poorly, breathes with difficulty or becomes floppy, go to the health post now.'
  orientation-accompanied: 'Show this product to the midwife or the nurse before she takes any more. If the baby sleeps much more than usual, feeds poorly, breathes with difficulty or becomes floppy, go to the health post now.'
