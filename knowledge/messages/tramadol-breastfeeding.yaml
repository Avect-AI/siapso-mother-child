id: tramadol-breastfeeding
fr:
  fact: 'Ce produit contient du tramadol, un médicament contre la douleur.'
  risk: 'Le tramadol passe dans le lait, et les nouveau-nés sont très sensibles à ce type de médicament.'
  risk-detail: "Chez certaines femmes, le corps transforme très vite le tramadol en une forme plus forte, qui passe aussi dans le lait. La notice française déconseille le tramadol pendant l'allaitement, sauf en général pour une seule prise."
  orientation: "Dites-le à la sage-femme à la prochaine visite. Si le bébé dort beaucoup plus que d'habitude, tète mal, respire difficilement ou devient mou, allez immédiatement au poste de santé."
en:
  fact: 'This product contains tramadol, a medicine for pain.'
  risk: 'Tramadol passes into breast milk, and newborns are very sensitive to this type of medicine.'
  risk-detail: 'In some women the body turns tramadol very fast into a stronger form, which also passes into the milk. The French label advises against tramadol during breastfeeding, except usually for a single dose.'
  orientation: 'Tell the midwife at the next visit. If the baby sleeps much more than usual, feeds poorly, breathes with difficulty or becomes floppy, go to the health post immediately.'
