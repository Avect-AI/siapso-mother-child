# SPDX-License-Identifier: CC-BY-4.0
# The sources policy. Only `allowed` sources may support a rule. `fact-only`
# sources may support a fact or a danger sign, their text is never copied, and
# a rule always also cites an allowed source. `forbidden` sources are never
# cited, copied or named in the content: `siapso-pack check` refuses them.
# This file is the only place allowed to name the forbidden sources.
allowed:
  - id: lactmed
    name: 'Drugs and Lactation Database (LactMed)'
    publisher: 'US National Library of Medicine'
    licence: 'Public domain'
    url: 'https://www.ncbi.nlm.nih.gov/books/NBK501922/'
    version: 'Record date or bulk archive date, given in each citation'
    notice: 'LactMed, US National Library of Medicine, public domain. Facts summarised in our own words.'
    documents: en
    fr:
      name: "Base de données sur les médicaments et l'allaitement (LactMed)"
      licence: 'Domaine public'
      version: "Date de la fiche ou de l'archive, donnée dans chaque citation"
  - id: openfda
    name: 'openFDA drug labels'
    publisher: 'US Food and Drug Administration'
    licence: 'CC0 1.0 / public domain'
    url: 'https://open.fda.gov/'
    version: 'Label version or access date, given in each citation'
    notice: 'openFDA drug labels, US Food and Drug Administration, CC0 1.0 / public domain. Citation links open the same labels on DailyMed (US National Library of Medicine, https://dailymed.nlm.nih.gov/), which shows the latest version of a label, not necessarily the effective date cited.'
    # The openFDA API answers JSON: a citation links the readable page of the
    # same label (its set_id) on DailyMed, the US National Library of
    # Medicine's display of the FDA labels. DailyMed shows the latest version,
    # which may be newer than the effective date in the locator; the quote was
    # read in the version cited.
    link-hosts: [dailymed.nlm.nih.gov]
    documents: en
    fr:
      name: 'Notices de médicaments des États-Unis (openFDA)'
      licence: 'CC0 1.0 / domaine public'
      version: 'Version de la notice ou date de consultation, donnée dans chaque citation'
  - id: fda-dsc
    name: 'FDA Drug Safety Communications'
    publisher: 'US Food and Drug Administration'
    licence: 'Public domain'
    url: 'https://www.fda.gov/drugs/drug-safety-and-availability/drug-safety-communications'
    version: 'Communication date, given in each citation'
    notice: 'FDA Drug Safety Communications, US Food and Drug Administration, public domain.'
    documents: en
    fr:
      name: 'Communications de sécurité de la FDA (États-Unis)'
      licence: 'Domaine public'
      version: 'Date de la communication, donnée dans chaque citation'
  - id: bdpm
    name: 'Base de données publique des médicaments (BDPM)'
    publisher: 'Agence nationale de sécurité du médicament et des produits de santé (ANSM)'
    licence: 'Licence Ouverte 2.0'
    url: 'https://base-donnees-publique.medicaments.gouv.fr/'
    # The download date of CIS_bdpm.txt and CIS_COMPO_bdpm.txt, the files read by
    # "pnpm knowledge:import-bdpm" to write registry/products/bdpm.yaml. The
    # import prints the size and sha256 of each file; the files of 2026-11-04
    # that produced the committed registry/products/bdpm.yaml are:
    # - CIS_bdpm.txt: 3167022 bytes, sha256
    #   97dcd8fc406e1c0bfb969cad6f66bda489eeede1c9910e2813dd65e1ab71d752
    # - CIS_COMPO_bdpm.txt: 2720142 bytes, sha256
    #   18c2eb506602946b8a5010fd56a5339e6571ba8f76480b62dc751dd26c150716
    version: 'Product files CIS_bdpm.txt and CIS_COMPO_bdpm.txt downloaded on 4 November 2026; RCP update dates given in each citation'
    accessed: 2026-11-04
    notice: 'Base de données publique des médicaments, ANSM, Licence Ouverte 2.0.'
    documents: fr
    fr:
      name: 'Base de données publique des médicaments (BDPM)'
      licence: 'Licence Ouverte 2.0'
      version: 'Fichiers des produits CIS_bdpm.txt et CIS_COMPO_bdpm.txt téléchargés le 04/11/2026 ; dates de mise à jour des RCP données dans chaque citation'
  - id: ansm-thesaurus
    name: 'Thésaurus des interactions médicamenteuses'
    publisher: 'Agence nationale de sécurité du médicament et des produits de santé (ANSM)'
    licence: 'Reuse with citation of the source'
    url: 'https://ansm.sante.fr/'
    version: 'September 2023'
    notice: 'Thésaurus des interactions médicamenteuses, ANSM, September 2023 version, reused with citation of the source.'
    documents: fr
    fr:
      name: 'Thésaurus des interactions médicamenteuses'
      licence: 'Réutilisation avec citation de la source'
      version: 'Septembre 2023'
  - id: literature
    name: 'Peer-reviewed literature'
    publisher: 'Journal publishers, cited by reference'
    licence: 'Cited by reference; summarised in our own words'
    url: 'https://pubmed.ncbi.nlm.nih.gov/'
    version: 'Reference given in each citation'
    notice: 'Peer-reviewed literature, cited by reference and summarised in our own words.'
    documents: en
    fr:
      name: 'Articles scientifiques relus par des pairs'
      licence: 'Cités par leur référence, résumés avec nos mots'
      version: 'Référence donnée dans chaque citation'
fact-only:
  - id: who
    name: 'World Health Organization guidelines and lists'
    publisher: 'World Health Organization'
    licence: 'Varies by document: CC BY-NC-SA 3.0 IGO or all rights reserved'
    url: 'https://www.who.int/'
    version: 'Edition given in each citation'
    notice: 'World Health Organization guidelines and lists (licence varies by document: CC BY-NC-SA 3.0 IGO or all rights reserved). Used for facts only: no text is copied.'
    documents: en
    fr:
      name: "Recommandations et listes de l'Organisation mondiale de la santé"
      licence: 'Selon le document : CC BY-NC-SA 3.0 IGO ou tous droits réservés'
      version: 'Édition donnée dans chaque citation'
forbidden:
  - id: ddinter
    reason: 'Non-commercial licence: not compatible with an open knowledge base.'
    domains: [ddinter.scbdd.com]
  - id: lediam
    reason: 'No licence: reuse is not permitted.'
    domains: []
  - id: e-lactancia
    reason: 'Restricted terms of use: reuse is not permitted.'
    domains: [e-lactancia.org]
  - id: crat
    reason: 'Restricted terms of use: reuse is not permitted.'
    domains: [lecrat.fr]
  - id: theriaque
    reason: 'Restricted terms of use: reuse is not permitted.'
    domains: [theriaque.org]
  - id: vidal
    reason: 'Commercial publisher: reuse is not permitted.'
    domains: [vidal.fr]
  - id: drugbank-full
    reason: 'The full database is not open: it is not used.'
    domains: [drugbank.com, go.drugbank.com]
