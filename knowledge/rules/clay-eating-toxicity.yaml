    locator: 'Orisakwe OE, Udowelle NA, Azuonwu O, et al. Cadmium and lead in geophagic clay consumed in Southern Nigeria: health risk from such traditional nutraceutical. Environ Geochem Health. 2020. doi:10.1007/s10653-020-00632-0. PMID 32607698'
    url: 'https://pubmed.ncbi.nlm.nih.gov/32607698/'
    accessed: 2026-11-03
