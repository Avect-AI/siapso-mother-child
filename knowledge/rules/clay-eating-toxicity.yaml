# Reference case 7. Clay or earth eaten during pregnancy (geophagy): lead
# found in market clays, pica linked to anaemia (observational data), and a
# purified medicinal clay not recommended during pregnancy by its label.
id: clay-eating-toxicity
kind: toxicity
when:
  subject: { plant: clay }
  pregnancy-windows: [lt12, 12-19, 20-29, 30-plus]
level: next-contact
evidence: C
message: clay-eating-toxicity
sources:
