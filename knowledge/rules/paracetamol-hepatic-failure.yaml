# SPDX-License-Identifier: CC-BY-4.0
# Live test round 1: liver failure ticked in the profile changed nothing. The
# French label contraindicates paracetamol in severe liver failure and lowers
# the daily maximum in mild to moderate liver failure; the profile does not
# say how severe it is, so the rule takes the contraindication's level. The
# evidence is pharmacokinetic (slower clearance in chronic liver failure,
# evidence B). The lower daily maximum lives only in the quotes: whether a
# max-dose rule should use it is a question for the clinical committee.
id: paracetamol-hepatic-failure
kind: condition
when:
  subject: { substance: paracetamol }
  requires:
    - condition: hepatic-failure
level: before-next-dose
evidence: B
message: paracetamol-hepatic-failure
