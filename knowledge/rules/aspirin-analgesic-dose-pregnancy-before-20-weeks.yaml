# Live test round 1: Aspegic 500 mg at 11 or 19 weeks gave "nothing found"
# while ibuprofen gave next-contact. Aspirin above 100 mg per unit before 20
# weeks, as nsaid-pregnancy-before-20-weeks (same level and evidence): the
# French label puts doses between 100 and 500 mg per day under the rules of
# higher doses, allows them before 24 weeks only when absolutely necessary and
# links prostaglandin synthesis inhibitors in the first trimester to
# miscarriage (epidemiological studies, evidence C). Low-dose aspirin
# (100 mg or less) is not flagged; a product of unknown strength is. The
# threshold lives only in strength-above-mg and in the quotes.
id: aspirin-analgesic-dose-pregnancy-before-20-weeks
kind: pregnancy
when:
  subject: { substance: aspirin }
  strength-above-mg: 100
  pregnancy-windows: [lt12, 12-19]
level: next-contact
evidence: C
message: aspirin-analgesic-dose-pregnancy-before-20-weeks
