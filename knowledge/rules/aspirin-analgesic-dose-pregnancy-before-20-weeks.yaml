    quote: 'Sauf nécessité absolue, ASPEGIC 500 mg, poudre pour solution buvable en sachet-dose ne doit pas être prescrit chez une femme qui envisage une grossesse ou au cours des 5 premiers mois de grossesse (avant 24 semaines d’aménorrhée).'
