# Live test round 1: Tegretol in pregnancy gave "nothing found". Carbamazepine
# raises the risk of major birth defects (French label: two to three times the
# general rate, from population data; evidence A, as for valproate). Ending an
# epilepsy treatment alone can cause serious seizures: the message says that
# it must not be stopped without a doctor and refers soon, changing nothing.
id: carbamazepine-pregnancy
kind: pregnancy
when:
  subject: { substance: carbamazepine }
level: before-next-dose
evidence: A
message: carbamazepine-pregnancy
sources:
