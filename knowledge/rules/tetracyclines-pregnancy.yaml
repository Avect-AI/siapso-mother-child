# Tetracyclines from the second trimester stain the child's teeth; the
# French label contraindicates them from the second trimester (and prefers
# to avoid them in the first). Window 12-19 starts at 12 weeks.
id: tetracyclines-pregnancy
kind: pregnancy
when:
  subject: { class: tetracycline }
  pregnancy-windows: [12-19, 20-29, 30-plus]
level: before-next-dose
evidence: A
message: tetracyclines-pregnancy
sources:
  - source: bdpm
    locator: 'DOXY 100 mg, comprimé pelliculé, RCP 4.6 (ANSM, 25/03/2024), CIS 61722191'
    url: 'https://base-donnees-publique.medicaments.gouv.fr/affichageDoc.php?specid=61722191&typedoc=R'
    accessed: 2026-11-03
    quote: "A partir du deuxième trimestre de la grossesse, l'administration de cyclines est contre-indiquée."
  - source: bdpm
    locator: 'DOXY 100 mg, comprimé pelliculé, RCP 4.6 (ANSM, 25/03/2024), CIS 61722191'
    url: 'https://base-donnees-publique.medicaments.gouv.fr/affichageDoc.php?specid=61722191&typedoc=R'
    accessed: 2026-11-03
    quote: "L'administration de cyclines au cours des deuxième et troisième trimestres expose le fœtus au risque de coloration des dents de lait."
  - source: openfda
    locator: 'Doxycycline hyclate drug label, NuCare Pharmaceuticals, Inc., set_id 0106a3d3-db4d-f6ee-e063-6294a90a25e9, effective 20260826'
    url: 'https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=0106a3d3-db4d-f6ee-e063-6294a90a25e9'
    accessed: 2026-11-03
    quote: 'The use of drugs of the tetracycline class during tooth development (last half of pregnancy, infancy and childhood to the age of 8 years) may cause permanent discoloration'
