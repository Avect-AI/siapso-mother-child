# Misoprostol makes the womb contract. The message stays neutral: it names
# neither the substance, nor a dose, nor any use; the risk of rupture of the
# womb rises with the term and with a scar.
id: misoprostol-pregnancy
kind: pregnancy
when:
  subject: { substance: misoprostol }
level: before-next-dose
evidence: A
message: misoprostol-pregnancy
sources:
  - source: openfda
    locator: 'Cytotec (misoprostol) drug label, Pfizer Laboratories Div Pfizer Inc, set_id 4ab12da7-5731-4e06-bf1c-bc3f2e711f12, effective 20260604, boxed warning'
    url: 'https://api.fda.gov/drug/label.json?search=openfda.brand_name%3A%22Cytotec%22&limit=1'
    accessed: 2026-11-03
    quote: 'CYTOTEC (MISOPROSTOL) ADMINISTRATION TO WOMEN WHO ARE PREGNANT CAN CAUSE BIRTH DEFECTS, ABORTION, PREMATURE BIRTH OR UTERINE RUPTURE.'
  - source: openfda
    locator: 'Cytotec (misoprostol) drug label, Pfizer Laboratories Div Pfizer Inc, set_id 4ab12da7-5731-4e06-bf1c-bc3f2e711f12, effective 20260604, boxed warning'
