# Live test round 1: misoprostol with a uterine scar came out one level below
# castor oil at term with a scar. The US label reports rupture of the womb,
# says that its risk rises with prior uterine surgery and advises against use
# in the third trimester after a caesarean; the French label of the same
# substance asks for caution with a scarred womb and calls rupture very rare
# in the first trimester, hence the windows from 12 weeks. Evidence C (reported
# cases). The clinical committee must confirm the level and the windows.
id: misoprostol-pregnancy-uterine-scar
kind: pregnancy
when:
  subject: { substance: misoprostol }
  pregnancy-windows: [12-19, 20-29, 30-plus]
  requires:
    - condition: uterine-scar
level: danger
evidence: C
danger-rationale: 'Risk of rupture of a scarred womb with a substance that makes the womb contract (US label, boxed warning and labor and delivery section): a risk rising with the term, catastrophic when it occurs, an immediate vital risk for the mother and the baby.'
message: misoprostol-pregnancy-uterine-scar
