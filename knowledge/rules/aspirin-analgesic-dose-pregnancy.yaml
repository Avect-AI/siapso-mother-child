# Reference case 13. Aspirin above 100 mg per unit from 20 weeks (pain and
# fever products, but also Kardegic 160 mg and 300 mg). The French
# contraindication from 24 weeks applies above 100 mg per day; low-dose
# aspirin prescribed for some pregnancy conditions (100 mg or less) is not
# flagged. A product of unknown strength is flagged. The 100 mg threshold
# lives only in strength-above-mg and in the quotes: the message gives no
# dose figure. The orientation does not push skipping a prescribed treatment.
id: aspirin-analgesic-dose-pregnancy
kind: pregnancy
when:
  subject: { substance: aspirin }
  strength-above-mg: 100
  pregnancy-windows: [20-29, 30-plus]
level: before-next-dose
evidence: A
message: aspirin-analgesic-dose-pregnancy
sources:
