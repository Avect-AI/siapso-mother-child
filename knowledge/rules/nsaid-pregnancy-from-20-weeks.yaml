# Reference case 1. From 24 weeks of amenorrhoea the French label
# contraindicates any NSAID intake, even a single one; from 20 weeks the US
# label and the FDA advise against it. Aspirin has its own rule.
id: nsaid-pregnancy-from-20-weeks
kind: pregnancy
when:
  subject: { class: nsaid }
  pregnancy-windows: [20-29, 30-plus]
level: before-next-dose
evidence: A
message: nsaid-pregnancy-from-20-weeks
sources:
  - source: bdpm
    locator: 'ADVIL 200 mg, comprimé enrobé, RCP section 4.4 (ANSM, updated 13/02/2025), CIS 68634000'
