# Castor oil late in pregnancy without a known uterine scar (with a scar,
# castor-oil-term-uterine-scar applies instead). It can start contractions;
# serious outcomes for the mother and the baby are not documented.
id: castor-oil-late-pregnancy
kind: toxicity
when:
  subject: { plant: castor-oil }
  pregnancy-windows: [30-plus]
  unless-conditions: [uterine-scar]
level: next-contact
evidence: C
message: castor-oil-late-pregnancy
sources:
  - source: literature
    locator: 'Kelly AJ, Kavanagh J, Thomas J. Castor oil, bath and/or enema for cervical priming and induction of labour. Cochrane Database Syst Rev. 2013. doi:10.1002/14651858.CD003099.pub2. PMID 23881775'
    url: 'https://pubmed.ncbi.nlm.nih.gov/23881775/'
    accessed: 2026-11-03
    quote: 'Castor oil has been widely used as a traditional method of initiating labour in midwifery practice.'
  - source: literature
    locator: 'Bayoumi YA, Alalfy M, Sharkawy M, et al. Castor oil for labor initiation in women with a previous cesarean section: a double-blind randomized study. J Matern Fetal Neonatal Med. 2022. doi:10.1080/14767058.2021.2008350. PMID 34886746 (castor oil starts labour)'
    url: 'https://pubmed.ncbi.nlm.nih.gov/34886746/'
    accessed: 2026-11-03
    quote: 'Castor oil appears to be an effective, low-cost, and non-harmful method for the initiation of labor in patients with a previous cesarean section.'
  - source: literature
    locator: 'Kelly AJ, Kavanagh J, Thomas J. Castor oil, bath and/or enema for cervical priming and induction of labour. Cochrane Database Syst Rev. 2013. doi:10.1002/14651858.CD003099.pub2. PMID 23881775'
    url: 'https://pubmed.ncbi.nlm.nih.gov/23881775/'
    accessed: 2026-11-03
    quote: 'There were no data presented on neonatal or maternal mortality or morbidity.'
  - source: literature
    locator: 'Sicuranza GB, Figueroa R. Uterine rupture associated with castor oil ingestion. J Matern Fetal Neonatal Med. 2003. doi:10.1080/jmf.13.2.133.134. PMID 12735415'
    url: 'https://pubmed.ncbi.nlm.nih.gov/12735415/'
    accessed: 2026-11-03
    quote: 'a portion of the umbilical cord was protruding from a 2-cm rupture of the lower transverse scar'
  - source: lactmed
    locator: 'Castor (LactMed record LM957, revised 2024-12-15, Bookshelf NBK501875), read from the NLM LactMed bulk archive of 2026-10-22'
    url: 'https://www.ncbi.nlm.nih.gov/books/NBK501875/'
    accessed: 2026-11-03
    quote: 'Castor oil is a strong stimulant laxative.'
  - source: openfda
    locator: 'Foster and Thrive Castor Oil (OTC) drug label, Strategic Sourcing Services, LLC, set_id 004d1dc2-47c1-84d1-e063-6394a90a2471, effective 20241230'
    url: 'https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=004d1dc2-47c1-84d1-e063-6394a90a2471'
    accessed: 2026-11-03
    quote: 'If pregnant or breast feeding ask a health professional before use'
review:
