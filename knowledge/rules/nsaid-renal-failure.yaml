# Live test round 1: kidney failure ticked in the profile did not change the
# result for ibuprofen. The French label contraindicates NSAIDs in severe
# kidney failure and asks for monitoring in chronic kidney failure, since they
# can cause functional kidney failure (evidence A). The profile does not say
# how severe it is, so the rule takes the contraindication's level. Aspirin is
# outside the nsaid class: the committee must say whether it needs this rule.
id: nsaid-renal-failure
kind: condition
when:
  subject: { class: nsaid }
  requires:
    - condition: renal-failure
level: before-next-dose
evidence: A
message: nsaid-renal-failure
sources:
