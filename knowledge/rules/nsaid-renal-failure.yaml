    locator: 'ADVIL 200 mg, comprimé enrobé, RCP 4.3 (ANSM, 13/02/2025), CIS 68634000'
    url: 'https://base-donnees-publique.medicaments.gouv.fr/affichageDoc.php?specid=68634000&typedoc=R'
    accessed: 2026-11-05
    quote: 'insuffisance rénale sévère'
  - source: bdpm
    locator: 'ADVIL 200 mg, comprimé enrobé, RCP 4.4 (ANSM, 13/02/2025), CIS 68634000'
    url: 'https://base-donnees-publique.medicaments.gouv.fr/affichageDoc.php?specid=68634000&typedoc=R'
    accessed: 2026-11-05
    quote: "Les AINS, en inhibant l'action vasodilatatrice des prostaglandines rénales, sont susceptibles de provoquer une insuffisance rénale fonctionnelle par diminution de la filtration glomérulaire."
  - source: bdpm
    locator: 'ADVIL 200 mg, comprimé enrobé, RCP 4.4 (ANSM, 13/02/2025), CIS 68634000'
