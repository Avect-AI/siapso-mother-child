# Reference case 7. Medicinal clays (kaolin, diosmectite) lower the
# absorption of medicines taken at the same time, iron included (ANSM
# thesaurus). For clays eaten as such, only laboratory data exist (evidence
# D): the step from medicinal clays to geophagic clays is an extrapolation.
id: clay-with-iron
kind: herb-drug
when:
  subject: { plant: clay }
  requires:
    - with: { substance: iron }
level: next-contact
evidence: D
message: clay-with-iron
sources:
  - source: literature
    locator: 'Seim GL, Ahn CI, Bodis MS, et al. Bioavailability of iron in geophagic earths and clay minerals, and their effect on dietary iron absorption using an in vitro digestion/Caco-2 cell model. Food Funct. 2013. doi:10.1039/c3fo30380b. PMID 23787405'
    url: 'https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pubmed&id=23787405&retmode=xml'
    accessed: 2026-11-03
    quote: 'some geophagic earth and clay mineral samples inhibit Fe absorption from foods'
  - source: ansm-thesaurus
    locator: 'Thésaurus des interactions médicamenteuses (ANSM, 15 septembre 2023), TOPIQUES GASTRO-INTESTINAUX, ANTIACIDES ET ADSORBANTS'
