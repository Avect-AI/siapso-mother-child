# Reference case 8. The risk is extensive or long use, as in cosmetic skin
# lightening (Dakar cohort, Cochrane review); the French label accepts a
# short use on a small area. A sudden stop after long use is a risk too, so
# the message never asks to stop.
id: clobetasol-pregnancy
kind: pregnancy
when:
  subject: { substance: clobetasol }
level: before-next-dose
evidence: C
message: clobetasol-pregnancy
sources:
  - source: literature
    locator: 'Mahé A, Perret JL, Ly F, et al. The cosmetic use of skin-lightening products during pregnancy in Dakar, Senegal: a common and potentially hazardous practice. Trans R Soc Trop Med Hyg. 2007. doi:10.1016/j.trstmh.2006.06.007. PMID 17023012'
    url: 'https://pubmed.ncbi.nlm.nih.gov/17023012/'
    accessed: 2026-11-03
    quote: 'had a statistically significant lower plasma cortisol level and a smaller placenta, and presented a higher rate of low-birth-weight infants'
