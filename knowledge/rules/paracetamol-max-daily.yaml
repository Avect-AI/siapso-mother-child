# Reference case 2. The engine sums strength x units per day over the items
# that contain paracetamol. Threshold: 3 g per day, the adult maximum of the
# DOLIPRANE 1000 mg and EFFERALGAN 1000 mg RCP dosage tables (adults and
# children from 50 kg); the labels allow up to 4 g per day only on medical
# advice, and keep 3 g as the maximum for adults under 50 kg, chronic
# malnutrition or dehydration. The clinical committee must confirm this
# threshold. The message never states a dose. The table quotes join the
# cells of one row in document order. With the box of unknown strength the
# engine reads the strengths of the product's family by the same route: the
# lowest adult one as certain (registry/substances.yaml,
# adult-min-strength-mg), the highest as possible (max-dose-may-exceed, before
# the next dose). A product of the family with no strength in mg (a
# suspension) chosen with "Je ne sais pas" is read with the family's tablet
# strengths, so a unit of a liquid may count as a tablet: this can only
# over-alert (knowledge/README.md, R-2).
id: paracetamol-max-daily
kind: max-dose
when:
  subject: { substance: paracetamol }
  max-mg-per-day: 3000
level: before-next-dose
evidence: A
message: paracetamol-max-daily
