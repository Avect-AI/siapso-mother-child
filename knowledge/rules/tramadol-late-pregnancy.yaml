# Live test round 2 (SCRUM-52): tramadol at 37 weeks gave "nothing applies".
# The French label links a prolonged use during pregnancy to a withdrawal
# syndrome in the newborn and an intake before or during labour to changes in
# the newborn's breathing; the US label says the same and advises against it
# during or just before labour. Late pregnancy is read as the window from 30
# weeks (no window starts at 37 weeks; with the term look-ahead it applies from
# 26 weeks). The French label also says not to use tramadol in pregnant women
# at all (insufficient human data, animal effects at very high doses): the
# committee decides whether a rule should cover the earlier windows.
id: tramadol-late-pregnancy
kind: pregnancy
when:
  subject: { substance: tramadol }
  pregnancy-windows: [30-plus]
level: before-next-dose
evidence: C
message: tramadol-late-pregnancy
