    locator: 'DOLIPRANE 1000 mg, comprimé, RCP 4.9 (ANSM, 25/08/2025), CIS 60234100'
    url: 'https://base-donnees-publique.medicaments.gouv.fr/affichageDoc.php?specid=60234100&typedoc=R'
    accessed: 2026-11-05
    quote: "Le traitement du surdosage comprend classiquement l'administration aussi précoce que possible de l'antidote N-acétylcystéine par voie I.V. ou voie orale si possible avant la dixième heure."
  - source: bdpm
    # The risk factors of a serious intoxication: provenance of the committee question R-1.
    locator: 'DOLIPRANE 1000 mg, comprimé, RCP 4.9 (ANSM, 25/08/2025), CIS 60234100'
    url: 'https://base-donnees-publique.medicaments.gouv.fr/affichageDoc.php?specid=60234100&typedoc=R'
    accessed: 2026-11-05
    quote: "Le risque d'une intoxication grave (surdosage thérapeutique ou intoxication accidentelle) peut être particulièrement élevé chez les sujets âgés, chez les jeunes enfants, chez les patients avec une atteinte hépatique ou rénale, en cas d'alcoolisme chronique, chez les patients souffrant de malnutrition chronique (voir rubrique 4.2), jeûne, amaigrissement récent, cholémie familiale (syndrome de Gilbert) ainsi que les patients recevant des médicaments inducteurs enzymatiques."
