  - source: bdpm
    locator: 'DOLIPRANE 1000 mg, comprimé, RCP 4.9 (ANSM, 25/08/2025), CIS 60234100'
    url: 'https://base-donnees-publique.medicaments.gouv.fr/affichageDoc.php?specid=60234100&typedoc=R'
    accessed: 2026-11-05
    quote: 'Les symptômes cliniques de l’atteinte hépatique sont généralement observés après 1 à 2 jours, et atteignent un maximum après 3 à 4 jours.'
  - source: bdpm
    locator: 'DOLIPRANE 1000 mg, comprimé, RCP 4.9 (ANSM, 25/08/2025), CIS 60234100'
