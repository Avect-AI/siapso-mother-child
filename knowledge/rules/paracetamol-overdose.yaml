# Live test round 2 (SCRUM-52): 8 or 24 grams of paracetamol a day gave the
# same "before the next dose" as 3.5 grams. A daily amount of at least twice
# the maximum of paracetamol-max-daily (3 g, so 6 g) is read as a danger: the
# label describes liver damage that can be fatal, signs that appear only after
# one or two days, and asks for immediate transfer to hospital even without
# early symptoms, with an antidote given as early as possible. 6 g a day
# (twice the maximum) is an engineering default, not a figure of the label:
# the label names no daily toxic threshold, and warns that the risk of a
# serious intoxication is higher with liver or kidney disease, malnutrition,
# fasting or recent weight loss (the quote below). The clinical review of the
# pull request kept 6 g as defensible and more cautious than 8 g; the clinical
# committee must confirm it (knowledge/README.md, R-1). With the strength
# unknown, the engine counts the lowest adult strength of the family as
# certain (a danger when it reaches 6 g) and the highest as possible: a
# possible toxic amount is held at before the next dose with its own message,
# paracetamol-overdose-possible (R-2). A product of the family with no
# strength (a suspension) chosen with "Je ne sais pas" is read with the
# strengths of the family's tablets: this can only over-alert.
id: paracetamol-overdose
kind: max-dose
when:
  subject: { substance: paracetamol }
  from-mg-per-day: 6000
level: danger
possible-message: paracetamol-overdose-possible
danger-rationale: 'At twice the daily maximum or more, paracetamol can cause severe liver damage that can be fatal. The signs of liver damage often appear only one or two days later, while the antidote protects the liver best when given early: the label asks for immediate transfer to hospital even without early symptoms. Waiting for signs loses the time the treatment needs.'
evidence: A
message: paracetamol-overdose
sources:
