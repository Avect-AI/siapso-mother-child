# Demo product written by hand (live test round 2, SCRUM-51): Artotec, a
# tablet of diclofenac with misoprostol (Arthrotec in the United States, its
# openFDA label: "diclofenac sodium/misoprostol"), is absent from the BDPM
# files of 2026-11-04, so the BDPM import leaves it out. It is sold in two
# strengths of diclofenac; without a source for the box she holds, none is
# given: the engine then reads them as unknown. Its availability in Senegal
# is not verified.
id: artotec
names: { fr: 'Artotec, comprimé gastro-résistant', en: 'Artotec, gastro-resistant tablet' }
brands: ['Artotec', 'Arthrotec']
local-names: []
components:
  - { substance: diclofenac }
  - { substance: misoprostol }
form: 'comprimé gastro-résistant'
route: oral
source: { demo-manual: true }
demo: true
