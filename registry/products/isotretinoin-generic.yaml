# Demo product written by hand for a medicine common in Senegal that the
# BDPM import does not cover. Its availability in Senegal is not verified.
# The brand is a name people commonly use for this medicine: the resolver
# indexes it as another name of the generic.
id: isotretinoin-generic
names: { fr: 'Isotrétinoïne (générique)', en: 'Isotretinoin (generic)' }
brands: ['Roaccutane']
local-names: []
components:
  - { substance: isotretinoin }
form: 'capsule molle'
route: oral
source: { demo-manual: true }
demo: true
