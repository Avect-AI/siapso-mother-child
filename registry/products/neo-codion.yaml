# Demo product written by hand: Néo-Codion is common in Senegal but not
# marketed in France, so the BDPM import leaves it out. The codeine strength
# is the therapeutic fraction of the coated tablet in the BDPM composition
# file of 2026-11-04 (CIS 65282348, codeine camphosulfonate 25 mg). Its other
# substances (sulfogaiacol, grindelia soft extract) are not in the registry.
# Its availability in Senegal is not verified.
id: neo-codion
names: { fr: 'Néo-Codion, comprimé enrobé', en: 'Néo-Codion, coated tablet' }
brands: ['Néo-Codion']
local-names: []
components:
  - { substance: codeine, strength-mg: 14.93 }
form: 'comprimé enrobé'
route: oral
source: { demo-manual: true }
demo: true
