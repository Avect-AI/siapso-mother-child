# Demo product written by hand for a medicine common in Senegal that the
# BDPM import does not cover. Its availability in Senegal is not verified.
# The brand is a name people commonly use for this medicine (the BDPM files
# of 2026-11-04 list no Vibramycine): the resolver indexes it as another name
# of the generic.
id: doxycycline-generic
names: { fr: 'Doxycycline (générique)', en: 'Doxycycline (generic)' }
brands: ['Vibramycine']
local-names: []
components:
  - { substance: doxycycline }
form: 'comprimé'
route: oral
source: { demo-manual: true }
demo: true
