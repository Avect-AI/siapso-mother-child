# SPDX-License-Identifier: CC-BY-4.0
# Demo product written by hand for a medicine common in Senegal that the
# BDPM import does not cover under these names. Its availability in Senegal
# is not verified. The brands are names people commonly use for this
# medicine (live test round 2, SCRUM-51): the IMETH tablets are not marketed
# in the BDPM files of 2026-11-04 (only its injections, which the import
# leaves out), and Ledertrexate is absent from them. The resolver indexes
# them as other names of the generic.
id: methotrexate-generic
names: { fr: 'Méthotrexate (générique)', en: 'Methotrexate (generic)' }
brands: ['Imeth', 'Ledertrexate']
local-names: []
components:
  - { substance: methotrexate }
form: 'comprimé'
route: oral
source: { demo-manual: true }
demo: true
