# Demo product written by hand for a medicine people in Senegal still name:
# the BDPM files of 2026-11-04 list NIVAQUINE 100 mg (CIS 65130778) as not
# marketed, so the BDPM import leaves it out. The brand is a name people
# commonly use for this medicine: the resolver indexes it as another name of
# the generic. Its availability in Senegal is not verified.
id: chloroquine-generic
names: { fr: 'Chloroquine (générique)', en: 'Chloroquine (generic)' }
brands: ['Nivaquine']
local-names: []
components:
  - { substance: chloroquine }
form: 'comprimé'
route: oral
source: { demo-manual: true }
demo: true
