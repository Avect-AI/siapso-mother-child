# Products named inside a sentence (SCRUM-61, see eval/speech/README.md).
# Sentences written the way people speak to the app or the way the voice
# writes them (lowercase, little punctuation, French names spelt as heard by
# the Wolof voice). No real patient data: every sentence and first name is
# invented. The expectations were written from the registry (product ids,
# brands, local names), not from the output of the resolver.
#   lang: fr (French), wo (Wolof grammar; a medicine keeps its French or brand
#         name, as Wolof speakers say it), mix (French and Wolof mixed).
#   type: plain (names said as written), misspelt (a name spelt as heard),
#         none (no product: symptoms, food, first names, a medicine the base
#         does not have).
#   expect: one item per product named: { kind, id } (any product of its
#         family is right), or { any: [...] } when several families are
#         equally right; mg when a strength is said with it.
#   notTaken (round 3 of the review of #68): the products named but not
#         taken, as in sentences-heldout.yaml: ticked, a false product.

