# Held-out sentences (review of #68, see eval/speech/README.md): written
# before the rules for products named but not taken, and never tuned on.
# Measured once, with `pnpm eval:sentences:heldout`, and reported as they
# are: no bar. No real patient data: every sentence is invented. The
# expectations were written from the registry and from what the sentence
# means, not from the output of the resolver.
#   lang, type, expect: as in sentences.yaml; expect holds the products the
#         speaker takes, or asks about.
#   notTaken: the products named but not taken (said with a negation, taken
#         by or given to another person, or taken before and stopped). A
#         ticked one is a false product; offered unticked is right.
#   case: affirmative, negation, other-person, past, food (a food that is
#         also a remedy, or a food the base does not have), list (several
#         products), question.

