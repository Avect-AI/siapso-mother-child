# Second held-out sentences (round 2 of the review of #68, see
# eval/speech/README.md): written and committed before the rules of round 2
# (another person named before, then a pronoun; told of or advised by
# someone else; a past said by a time), without reading again the sentences
# held-out set 1 failed on, and never tuned on. Measured once, with
# `pnpm eval:sentences:heldout-2`, and reported as they are: no bar. No real
# patient data: every sentence and first name is invented. The expectations
# were written from the registry and from what the sentence means, not from
# the output of the resolver.
#   lang, type, expect, notTaken: as in sentences-heldout.yaml.
#   case: as there, and advice (told of, advised or prescribed by someone
#         else: taken when a health worker prescribes it, not taken when a
#         neighbour, a friend, a relative or a healer only talks of it).

