info:
  title: SIAPSO Mother-Child evaluation API
  version: 0.1.0
  summary: Runs the same deterministic engine as the offline app.
  description: "The engine package is the one the offline app runs, so the same context and pack
    version give the same Evaluation online and offline. The API never accepts identifying data:
    every object of the request refuses unknown properties. The only free text is the name of an
    unrecognised item (80 characters at most); it must not contain personal data, and the server
    never logs or echoes it."
  license:
    name: MIT
    identifier: MIT
