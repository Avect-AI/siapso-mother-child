name: Feature request
description: Suggest an improvement
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who needs this, in which situation, and what is hard today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like to happen.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety considerations
      description: >-
        Could this change lead someone to start, stop or change a treatment, or
        reveal private information on a shared phone?
