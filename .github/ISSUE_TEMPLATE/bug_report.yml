name: Bug report
description: Something does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: >-
        Never include personal or health information about a real person.
        To report a security issue, read SECURITY.md instead of opening an issue.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the app in airplane mode
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App and knowledge base version
      description: Shown on the "Knowledge base" screen.
  - type: input
    id: device
    attributes:
      label: Phone and browser
      placeholder: "Android 13, Chrome 140"
