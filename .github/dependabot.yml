# Dependabot version updates. Security alerts and security updates are enabled
# in the repository settings (see tools/github/setup-repo.sh).
# The cooldown matches minimumReleaseAge (14 days) in pnpm-workspace.yaml.
version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    cooldown:
      default-days: 14
    labels: ['dependencies']
    commit-message:
      prefix: 'chore'
      include: 'scope'
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    labels: ['dependencies']
    commit-message:
      prefix: 'chore'
      include: 'scope'
    # Stay on the majors the toolchain supports: typescript-eslint supports
    # TypeScript below 6.1, and CI runs Node 24 (see .nvmrc).
    ignore:
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      dev-dependencies:
        dependency-type: 'development'
