name: hygiene

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  text:
    name: Texte propre (tirets cadratins, emojis, attribution)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fichiers suivis
        run: python3 tools/hygiene/hygiene.py files

      - name: Messages de commit de la PR
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for sha in $(git rev-list "$BASE..$HEAD"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/msg.txt"
            python3 tools/hygiene/hygiene.py message "$RUNNER_TEMP/msg.txt" || status=1
          done
          exit $status

      - name: Titre et description de la PR
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n%s\n' "$TITLE" "$BODY" | python3 tools/hygiene/hygiene.py text

      - name: Titre lie a un ticket Jira
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "$TITLE" | grep -Eq '^SCRUM-[0-9]+: ' || {
            echo "Le titre de la PR doit commencer par 'SCRUM-<n>: '." >&2
            exit 1
          }
