# SPDX-License-Identifier: MIT
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: REUSE lint (every file has a licence)
        run: |
          python3 -m venv "$RUNNER_TEMP/reuse-venv"
          "$RUNNER_TEMP/reuse-venv/bin/pip" install --require-virtualenv -r tools/reuse/requirements.txt
          "$RUNNER_TEMP/reuse-venv/bin/reuse" lint
      - name: Merge gate script (shellcheck and fake gh test)
        run: |
          shellcheck tools/github/merge-pr.sh tools/github/merge-pr.test.sh
          sh tools/github/merge-pr.test.sh
      # Fixture repositories only: the audit of the real history is run by
      # hand before publication and at release (docs/audit/2026-11-audit.md).
      # The test downloads the pinned gitleaks release and checks its SHA-256.
      - name: Pre-publication audit script (shellcheck and fixture test)
        run: |
          shellcheck tools/release/audit.sh tools/release/audit.test.sh
          sh tools/release/audit.test.sh
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test:coverage
      # knowledge:check compares minimum-safe-version with origin/main (it
      # never decreases nor disappears): the shallow checkout has no
      # origin/main, so fetch it first.
      - name: Fetch origin/main for the minimum safe version check
        run: git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
      - run: pnpm knowledge:check
      - run: pnpm eval:resolver
      # pnpm build is the demo build (Vite mode demo, app/.env.demo, into
      # app/dist-demo): it accepts the unsigned pack and is never published.
      # CI does not sign packs: the release workflow will, with a protected
      # environment (docs/pack-signing.md).
      - name: Build (demo build, never published)
        run: pnpm build
      # The production build must stop, and for the signing rules, not for
      # another reason: its output must name the refusal.
      - name: The release build refuses the unsigned pack
        run: |
          log="$RUNNER_TEMP/release-check.log"
          if pnpm --filter @siapso/app exec vite build --outDir "$RUNNER_TEMP/release-check" > "$log" 2>&1; then
            cat "$log"
            echo "A production build accepted an unsigned pack." >&2
            exit 1
          fi
          if ! grep -Eq "would refuse every knowledge pack|Release build refused" "$log"; then
            cat "$log"
            echo "The production build failed, but not with the signing refusal." >&2
            exit 1
          fi
          grep -E "would refuse every knowledge pack|Release build refused" "$log"
      - name: The build changes no committed file (NOTICE included)
        run: git diff --exit-code
      - run: pnpm budget:app
      - name: The server image builds (built locally on the runner, never pushed)
        run: docker build -f server/Dockerfile -t siapso-server:ci .

  e2e:
    name: End-to-end
    # The browser and its system libraries come with the image: no apt mirror
    # is on the way (it once took 14 minutes), so the limit measures the tests.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    container:
      # The official Playwright image of the version app/package.json pins,
      # pinned by digest like the actions. tools/ci/check-playwright-image.mjs
      # fails the unit tests and this job when the two differ: a Playwright
      # update changes the tag and the digest here too.
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      # The runner's user, which owns the workspace and the tool cache; the
      # host's shared memory, which Chromium needs (Playwright's advice).
      options: --user 1001 --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: The image is the Playwright app/package.json pins, by digest
        run: node tools/ci/check-playwright-image.mjs
      - run: pnpm install --frozen-lockfile
      # The digest decides what is pulled: a tag moved without its digest
      # pulls the old image, whose Chromium builds this Playwright lacks.
      - name: The image holds the Chromium builds this Playwright expects
        run: node tools/ci/check-playwright-image.mjs --browsers
      # The pack, then the tests: the Playwright web server makes a demo build
      # in app/dist-demo (never published) that accepts the unsigned pack.
      - run: pnpm knowledge:build
      - run: pnpm e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            app/playwright-report
            app/test-results
          retention-days: 7
