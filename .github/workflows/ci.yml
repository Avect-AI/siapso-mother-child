# SPDX-License-Identifier: MIT
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: REUSE lint (every file has a licence)
        run: |
          python3 -m venv "$RUNNER_TEMP/reuse-venv"
          "$RUNNER_TEMP/reuse-venv/bin/pip" install --require-virtualenv -r tools/reuse/requirements.txt
          "$RUNNER_TEMP/reuse-venv/bin/reuse" lint
      - name: Merge gate script (shellcheck and fake gh test)
        run: |
          shellcheck tools/github/merge-pr.sh tools/github/merge-pr.test.sh
          sh tools/github/merge-pr.test.sh
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm knowledge:check
      - run: pnpm eval:resolver
      - run: pnpm build
      - name: The build changes no committed file (NOTICE included)
        run: git diff --exit-code
      - run: pnpm budget:app
      - name: The server image builds (built locally on the runner, never pushed)
        run: docker build -f server/Dockerfile -t siapso-server:ci .

  e2e:
    name: End-to-end
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @siapso/app exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            app/playwright-report
            app/test-results
          retention-days: 7
